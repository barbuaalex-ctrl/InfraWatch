services:
  infrawatch:
    image: ghcr.io/barbuaalex-ctrl/infrawatch:${IMAGE_TAG:?Set IMAGE_TAG}
    container_name: infrawatch
    ports:
      - "3001:3000"
    volumes:
      - infrawatch-data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python3
        - healthcheck.py
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  infrawatch-data:
    external: true