services:
  infrawatch:
    image: ghcr.io/barbuaalex-ctrl/infrawatch:${IMAGE_TAG:?Set IMAGE_TAG}
    container_name: infrawatch
    ports:
      - "3001:3000"
    volumes:
      - infrawatch-data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python3
        - healthcheck.py
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
  
  green:
    image: ghcr.io/barbuaalex-ctrl/infrawatch:${GREEN_IMAGE_TAG:?Set GREEN_IMAGE_TAG}
    container_name: infrawatch-green
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - green-data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python3
        - healthcheck.py
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  nginx:
    image: nginx:stable-alpine
    container_name: infrawatch-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      infrawatch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  infrawatch-data:
    external: true
  green-data:
  
